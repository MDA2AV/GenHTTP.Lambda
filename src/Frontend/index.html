<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Describe an app to an AI agent and get it online with a link you can share. Use the agent built in or bring your own - Claude, Claude Code or anything that speaks MCP - and keep changing the app afterwards. Free, no account, nothing to install." />
    <meta name="keywords" content="agentic coding platform, build an app with ai, claude mcp server, host ai generated app, no code app builder, vibe coding hosting, share an app with a link, poll, guestbook, leaderboard" />
    <!-- the server rewrites the title and the tags below for each public page
         (src/pages.json) and adds rel="canonical" and og:url when
         LAMBDA_PUBLIC_URL is set - a canonical pointing at the wrong host is
         worse than none at all -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Describe an app, your agent puts it online" />
    <meta property="og:description" content="Describe an app, your agent builds it and puts it online - and you can keep changing it afterwards. Free, no account." />
    <meta property="og:site_name" content="GenHTTP Lambda" />
    <!-- written absolute by the server when it knows its public address, and
         per page where the page has a picture of its own (src/pages.json) -->
    <meta property="og:image" content="/social/default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GenHTTP Lambda: describe an app, your agent puts it online" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Describe an app, your agent puts it online" />
    <meta name="twitter:image" content="/social/default.png" />
    <meta name="twitter:description" content="Describe an app, your agent builds it and puts it online - and you can keep changing it afterwards. Free, no account." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- the bar a phone draws above the page, in the colour of the theme; the
         script below and the theme switch keep it in step -->
    <meta name="theme-color" content="#202124" />
    <title>Agentic Coding Platform - GenHTTP Lambda</title>
    <script>
      // applied before the first paint so the page never flashes the wrong theme
      (function () {
        try {
          var stored = localStorage.getItem('lambda-theme');
          document.documentElement.classList.toggle('dark', stored !== 'light');
          if (stored === 'light') {
            document.querySelector('meta[name="theme-color"]').content = '#ffffff';
          }
        } catch (e) { /* private mode */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
