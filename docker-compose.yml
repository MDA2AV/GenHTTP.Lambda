services:

  lambda:
    build: .
    image: genhttp-lambda:latest
    ports:
      # the ports have to match the ones the server binds: it upgrades plain
      # requests by name and port, so a mapping that renumbers them would
      # redirect clients to a port that is not open to them
      - "80:80"
      - "443:443"
    environment:
      LAMBDA_PORT: 80
      # HTTP/1.1 only, on both ports. HTTP/2 misbehaves again, and this is the
      # switch LambdaOptions names for falling back without a release -
      # Http1AndHttp2 turns it back on once the engine is fixed.
      LAMBDA_HTTP_PROTOCOLS: ${LAMBDA_HTTP_PROTOCOLS:-Http1}
      # TLS, terminated by the server itself - the certificate is published
      # into this directory by the certbot deploy hook
      # the administration panel, off unless the host supplies a token - the
      # value belongs in .env beside this file, not in a tracked one
      LAMBDA_ADMIN_TOKEN: ${LAMBDA_ADMIN_TOKEN:-}
      LAMBDA_TLS_PORT: 443
      LAMBDA_CERTIFICATE: /certs/fullchain.pem
      LAMBDA_CERTIFICATE_KEY: /certs/privkey.pem
      # further certificates, a subdirectory per name, for the other hostnames
      # the server answers to - the one above answers for anything not named
      LAMBDA_CERTIFICATE_DIRECTORY: /certs
      # the web root certbot writes its HTTP challenges into (--webroot -w
      # /opt/genhttp-lambda/acme), answered for every host - a lambda's own
      # domain included - so a certificate is issued without stopping this
      LAMBDA_ACME_DIRECTORY: /acme
      # hosts a browser may drive the agent endpoint from. An agent speaking
      # HTTP sends no origin and is never checked against this.
      LAMBDA_MCP_ORIGINS: genhttp.dev,www.genhttp.dev
      # the address pages name as canonical and the sitemap lists them under
      LAMBDA_PUBLIC_URL: https://genhttp.dev
      # where the lambdas answer, a subdomain each - quiz.genhttp.run. Takes a
      # wildcard record in the DNS, and the certificate for *.genhttp.run and
      # genhttp.run in /certs/genhttp.run/, which is then presented to every
      # name no other certificate is listed for
      LAMBDA_HOSTING_URL: https://genhttp.run
      # Deprecated: the limits of the tiers are set in the administration
      # panel (Limits) now. Passed through for one more release, so a value
      # still in .env remains the default until the panel saves one - the
      # server warns on startup for each that is set. Take them out of .env
      # once the panel holds what they said.
      LAMBDA_MAX_CODE_LENGTH: ${LAMBDA_MAX_CODE_LENGTH:-}
      LAMBDA_PREMIUM_MAX_CODE_LENGTH: ${LAMBDA_PREMIUM_MAX_CODE_LENGTH:-}
      LAMBDA_MAX_ASSET_BYTES: ${LAMBDA_MAX_ASSET_BYTES:-}
      LAMBDA_PREMIUM_MAX_ASSET_BYTES: ${LAMBDA_PREMIUM_MAX_ASSET_BYTES:-}
      LAMBDA_WORKSPACE_BYTES: ${LAMBDA_WORKSPACE_BYTES:-}
      LAMBDA_PREMIUM_WORKSPACE_BYTES: ${LAMBDA_PREMIUM_WORKSPACE_BYTES:-}
      # The tail of the run, readable in the panel at /logs.
      #
      # In memory and lost on a restart; docker still has the whole of it on
      # stdout, which is what to read when the question is about a process
      # that is no longer running.
      #
      # A million lines measured at about 220 MB of ordinary request lines,
      # so the memory budget below is what actually decides it: whichever
      # runs out first wins, and long lines simply mean fewer of them.
      LAMBDA_LOG_HISTORY: ${LAMBDA_LOG_HISTORY:-1000000}
      LAMBDA_LOG_MEMORY_MB: ${LAMBDA_LOG_MEMORY_MB:-256}
      LAMBDA_LOG_LAMBDA_OUTPUT: ${LAMBDA_LOG_LAMBDA_OUTPUT:-true}
      # How long identical lines are gathered into one rather than each being
      # written. The same request, from the same caller, answered the same
      # way, is one fact and a rate - and left alone it fills the ring.
      LAMBDA_LOG_REPEAT_WINDOW_SECONDS: ${LAMBDA_LOG_REPEAT_WINDOW_SECONDS:-10}
      # the address a request came from, kept against its lines. Personal
      # data, admin-gated, never part of the public figures - false leaves
      # every line in place with nothing personal on it.
      LAMBDA_LOG_CLIENT_ADDRESS: ${LAMBDA_LOG_CLIENT_ADDRESS:-true}
      # Which country a caller's range is registered in, read from the files
      # the regional registries publish and cached on the data volume. No
      # third party is asked, so no visitor's address leaves this machine.
      LAMBDA_LOG_GEO: ${LAMBDA_LOG_GEO:-true}
      LAMBDA_LOG_GEO_REFRESH_HOURS: ${LAMBDA_LOG_GEO_REFRESH_HOURS:-168}
      # A town and a network on top of the country, from the free DB-IP
      # databases: about 130 MB on the data volume, refetched monthly, and
      # nothing in memory because the files are mapped rather than read.
      # Still nobody is asked about a visitor - the database comes here.
      LAMBDA_LOG_GEO_PLACES: ${LAMBDA_LOG_GEO_PLACES:-true}
    sysctls:
      # lets the unprivileged user bind 80 and 443 inside its own network
      # namespace, so the server keeps running as uid 1001
      - net.ipv4.ip_unprivileged_port_start=0
    volumes:
      - lambda-data:/data
      - /opt/genhttp-lambda/certs:/certs:ro
      - /opt/genhttp-lambda/acme:/acme:ro
    restart: unless-stopped
    # What docker keeps of stdout, which has the address of every caller on
    # it: a fixed amount, the oldest going first, rather than a file that
    # grows for as long as the container lives. The privacy policy promises
    # exactly this, so a change here is a change to that page as well.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:

  # The bridge the server is published on, given IPv6 of its own.
  #
  # Without it, Docker cannot route an inbound IPv6 connection to an IPv4-only
  # container, so it relays one through docker-proxy instead - which opens a
  # fresh connection from the bridge gateway and loses the address it came
  # from. Every IPv6 visitor then arrives as 172.18.0.1, and on a host with an
  # AAAA record that is most of them: measured at 272 of 337 requests.
  #
  # A unique-local range, so there is nothing to route and nothing to collide
  # with. Inbound is what this is for; outbound keeps using IPv4, because a
  # ULA has no default route - which is why the egress proxy beside this one
  # goes on reaching the model API exactly as it did.
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:c0de:1a::/64

volumes:
  lambda-data:
