name: Release

# Publishes the community edition and its build agent to Docker Hub:
#
#   genhttp/lambda         the server (src/GenHTTP.Lambda.Community/Dockerfile)
#   genhttp/lambda-agent   the build agent and its egress proxy (docker/agent)
#
# for amd64 and arm64, tagged with the version and as latest. Runs for a tag
# v1.2.3, or by hand with a version. Needs the repository secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token of the genhttp
# account with read and write access).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, such as 1.2.3 (latest is tagged as well)'
        required: true

permissions:
  contents: read

jobs:

  images:

    name: Images

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: genhttp/lambda
            context: .
            file: src/GenHTTP.Lambda.Community/Dockerfile
          - image: genhttp/lambda-agent
            context: docker/agent
            file: docker/agent/Dockerfile

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # the tag without its v, or the version asked for
      - name: Version
        id: version
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "'$version' is no version"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.version.outputs.value }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
