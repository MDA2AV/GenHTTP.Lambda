name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  frontend:

    name: Frontend

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # one workspace at the root: the kit and the frontend of every component
      - name: Install dependencies
        run: npm ci

      # type checks and builds every bundle, prerendering the sites' pages
      - name: Build
        run: npm run build

      # the types catch a missing sentence; this catches one that lost a parameter or a link
      - name: Check translations
        run: npm run translations -- check

      # what each component serves, beside its project
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: src/*/bundle
          retention-days: 7

  backend:

    name: Backend

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build GenHTTP.Lambda.slnx -c Release

      # the tests compile and run lambdas, so they need the Roslyn reference
      # assemblies that ship with the SDK - no extra setup beyond the build
      - name: Test
        run: dotnet test GenHTTP.Lambda.slnx --no-build -c Release --logger "console;verbosity=normal"

  cloud:

    name: Image (cloud)

    needs: [frontend, backend]

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/GenHTTP.Lambda.Cloud/Dockerfile
          load: true
          tags: genhttp-lambda:ci
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,mode=max,scope=cloud

      # starts the image and walks a lambda through its whole life: created,
      # deployed, served on its public URL, undeployed
      - name: Smoke test
        run: |
          set -euo pipefail

          docker run -d --name lambda -p 8080:8080 genhttp-lambda:ci

          for i in $(seq 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' lambda)" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          docker inspect -f '{{.State.Health.Status}}' lambda | grep -qx healthy

          # --fail-with-body so a rejected request shows why, not just an exit code
          call() { curl -s --fail-with-body "$@"; }

          # the key has to survive validation: at least three characters
          keys=$(call -X POST http://localhost:8080/api/v1/lambdas \
                   -H 'Content-Type: application/json' \
                   -d '{"publicKey":"citest","acceptedTerms":true}')

          private=$(echo "$keys" | jq -r .privateKey)

          call -X POST "http://localhost:8080/api/v1/lambdas/$private/versions" \
               -H 'Content-Type: application/json' \
               -d '{"files":[{"name":"lambda.cs","code":"return Inline.Create().Get(() => \"ci\");"}]}' > /dev/null

          call -X POST "http://localhost:8080/api/v1/lambdas/$private/deployment/start" \
               -H 'Content-Type: application/json' -d '{}' | jq -e .success > /dev/null

          # every lambda answers at a subdomain named after its key - below
          # localhost here, as LAMBDA_HOSTING_URL is not set
          served=$(call -H 'Host: citest.localhost:8080' http://localhost:8080/)
          test "$served" = "ci" || { echo "expected 'ci', got '$served'"; exit 1; }

          # and the address it had below /lambda/ sends visitors there
          moved=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8080/lambda/citest/)
          test "$moved" = "301 http://citest.localhost:8080/" || { echo "expected a redirect to its address, got '$moved'"; exit 1; }

          # the components serve their own bundles
          for page in /en /editor/create /admin/ /en/source; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "http://localhost:8080$page")
            test "$status" = "200" || { echo "expected $page to be served, got $status"; exit 1; }
          done

          call -X POST "http://localhost:8080/api/v1/lambdas/$private/deployment/stop" > /dev/null

          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: citest.localhost:8080' http://localhost:8080/)
          test "$status" = "404" || { echo "expected 404 after undeploy, got $status"; exit 1; }

          echo "created, deployed, served and undeployed a lambda"

      - name: Server log
        if: always()
        run: docker logs lambda

  community:

    name: Image (community)

    needs: [frontend, backend]

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/GenHTTP.Lambda.Community/Dockerfile
          load: true
          tags: genhttp/lambda:ci
          cache-from: type=gha,scope=community
          cache-to: type=gha,mode=max,scope=community

      # the same life of a lambda, below /lambda/ on the one address the
      # installation runs at - and nothing to accept, as it has no terms
      - name: Smoke test
        run: |
          set -euo pipefail

          docker run -d --name lambda -p 8080:8080 genhttp/lambda:ci

          for i in $(seq 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' lambda)" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          docker inspect -f '{{.State.Health.Status}}' lambda | grep -qx healthy

          call() { curl -s --fail-with-body "$@"; }

          keys=$(call -X POST http://localhost:8080/api/v1/lambdas \
                   -H 'Content-Type: application/json' \
                   -d '{"publicKey":"citest","acceptedTerms":false}')

          private=$(echo "$keys" | jq -r .privateKey)

          call -X POST "http://localhost:8080/api/v1/lambdas/$private/versions" \
               -H 'Content-Type: application/json' \
               -d '{"files":[{"name":"lambda.cs","code":"return Inline.Create().Get(() => \"ci\");"}]}' > /dev/null

          call -X POST "http://localhost:8080/api/v1/lambdas/$private/deployment/start" \
               -H 'Content-Type: application/json' -d '{}' | jq -e .success > /dev/null

          served=$(call http://localhost:8080/lambda/citest/)
          test "$served" = "ci" || { echo "expected 'ci', got '$served'"; exit 1; }

          address=$(call "http://localhost:8080/api/v1/lambdas/$private" | jq -r .publicUrl)
          test "$address" = "http://localhost:8080/lambda/citest/" || { echo "expected its address below /lambda/, got '$address'"; exit 1; }

          for page in /en /en/docs /editor/create /admin/ /en/source; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "http://localhost:8080$page")
            test "$status" = "200" || { echo "expected $page to be served, got $status"; exit 1; }
          done

          echo "created, deployed and served a lambda below /lambda/"

      - name: Server log
        if: always()
        run: docker logs lambda
