# genhttp.dev, the cloud edition: the server on the io_uring engine, and the
# build agent behind the prompt box on /build and the Change section of the
# editor. deploy.sh beside this file builds, restarts and checks it.
#
# Its settings that are secret - the admin token, the agent's token, the token
# of the subscription the builds run on - are read from .env beside this file,
# which is not tracked.
#
# The community edition is run with samples/community instead.

# Named, because compose would name the project after this folder otherwise -
# and with it the containers and the volume with every lambda's data in it.
name: genhttplambda

services:

  lambda:
    build:
      context: ../..
      dockerfile: src/GenHTTP.Lambda.Cloud/Dockerfile
    image: genhttp-lambda:latest
    ports:
      # the ports have to match the ones the server binds: it upgrades plain
      # requests by name and port, so a mapping that renumbers them would
      # redirect clients to a port that is not open to them
      - "80:80"
      - "443:443"
    environment:
      LAMBDA_PORT: 80
      # The io_uring engine, which the images do not default to: it needs the
      # seccomp profile below.
      LAMBDA_ENGINE: ioxide
      # HTTP/1.1 only, on both ports. HTTP/2 misbehaves again, and this is the
      # switch ServerSettings names for falling back without a release -
      # Http1AndHttp2 turns it back on once the engine is fixed.
      LAMBDA_HTTP_PROTOCOLS: ${LAMBDA_HTTP_PROTOCOLS:-Http1}
      # the administration panel, off unless .env supplies a token
      LAMBDA_ADMIN_TOKEN: ${LAMBDA_ADMIN_TOKEN:-}
      # TLS, terminated by the server itself - the certificate is published
      # into this directory by the certbot deploy hook
      LAMBDA_TLS_PORT: 443
      LAMBDA_CERTIFICATE: /certs/fullchain.pem
      LAMBDA_CERTIFICATE_KEY: /certs/privkey.pem
      # further certificates, a subdirectory per name, for the other hostnames
      # the server answers to - the one above answers for anything not named
      LAMBDA_CERTIFICATE_DIRECTORY: /certs
      # the web root certbot writes its HTTP challenges into (--webroot -w
      # /opt/genhttp-lambda/acme), answered for every host - a lambda's own
      # domain included - so a certificate is issued without stopping this
      LAMBDA_ACME_DIRECTORY: /acme
      # hosts a browser may drive the agent endpoint from. An agent speaking
      # HTTP sends no origin and is never checked against this.
      LAMBDA_MCP_ORIGINS: genhttp.dev,www.genhttp.dev
      # the address pages name as canonical and the sitemap lists them under
      LAMBDA_PUBLIC_URL: https://genhttp.dev
      # where the lambdas answer, a subdomain each - quiz.genhttp.run. Takes a
      # wildcard record in the DNS, and the certificate for *.genhttp.run and
      # genhttp.run in /certs/genhttp.run/, which is then presented to every
      # name no other certificate is listed for
      LAMBDA_HOSTING_URL: https://genhttp.run
      # The tail of the run, readable in the panel at /admin/log.
      #
      # In memory and lost on a restart; docker still has the whole of it on
      # stdout, which is what to read when the question is about a process
      # that is no longer running.
      #
      # A million lines measured at about 220 MB of ordinary request lines,
      # so the memory budget below is what actually decides it: whichever
      # runs out first wins, and long lines simply mean fewer of them.
      LAMBDA_LOG_HISTORY: ${LAMBDA_LOG_HISTORY:-1000000}
      LAMBDA_LOG_MEMORY_MB: ${LAMBDA_LOG_MEMORY_MB:-256}
      LAMBDA_LOG_LAMBDA_OUTPUT: ${LAMBDA_LOG_LAMBDA_OUTPUT:-true}
      # How long identical lines are gathered into one rather than each being
      # written. The same request, from the same caller, answered the same
      # way, is one fact and a rate - and left alone it fills the ring.
      LAMBDA_LOG_REPEAT_WINDOW_SECONDS: ${LAMBDA_LOG_REPEAT_WINDOW_SECONDS:-10}
      # the address a request came from, kept against its lines. Personal
      # data, admin-gated, never part of the public figures - false leaves
      # every line in place with nothing personal on it.
      LAMBDA_LOG_CLIENT_ADDRESS: ${LAMBDA_LOG_CLIENT_ADDRESS:-true}
      # Which country a caller's range is registered in, read from the files
      # the regional registries publish and cached on the data volume. No
      # third party is asked, so no visitor's address leaves this machine.
      LAMBDA_LOG_GEO: ${LAMBDA_LOG_GEO:-true}
      LAMBDA_LOG_GEO_REFRESH_HOURS: ${LAMBDA_LOG_GEO_REFRESH_HOURS:-168}
      # A town and a network on top of the country, from the free DB-IP
      # databases: about 130 MB on the data volume, refetched monthly, and
      # nothing in memory because the files are mapped rather than read.
      # Still nobody is asked about a visitor - the database comes here.
      LAMBDA_LOG_GEO_PLACES: ${LAMBDA_LOG_GEO_PLACES:-true}
      # Where the server sends a prompt, and the shared secret it sends with
      # it. Empty LAMBDA_AGENT_URL leaves the whole feature off: no /build and
      # no Change section in the editor.
      LAMBDA_AGENT_URL: http://agent:8401
      LAMBDA_AGENT_TOKEN: ${LAMBDA_AGENT_TOKEN:-}
      # unset, the second model is not offered at all - there is no default
      # password, because a password in a tracked file is not one
      LAMBDA_AGENT_FABLE_PASSWORD: ${LAMBDA_AGENT_FABLE_PASSWORD:-}
      # A dump of the process when it dies of something it could not catch.
      #
      # A native crash leaves .NET no chance to say anything: heap corruption
      # is one line from glibc - "corrupted size vs. prev_size" - and an abort.
      # The core the kernel writes instead lands inside the container, where
      # the next deploy throws it away, and lacks what a debugger needs to show
      # a managed stack. The runtime's own dump has it: every thread's stack and
      # the heaps (type 2), with crash.dmp.crashreport.json beside it holding
      # the same stacks as JSON, readable without a debugger.
      #
      # One name, so each crash replaces the last. A lambda can take the
      # process down with nothing more than unbounded recursion, and a dump per
      # crash - two gigabytes and more - would let it fill the disk. The folder
      # has to exist: the image makes it, createdump does not. A dump is the
      # whole memory of the process - keys, tokens and the log with every
      # caller's address - so copy it off, read it, and delete it.
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 2
      DOTNET_DbgMiniDumpName: /data/dumps/crash.dmp
      DOTNET_EnableCrashReport: 1
    # The default seccomp profile of a container runtime does not allow the
    # io_uring syscalls, so the engine cannot start under it. This one is the
    # default with those three syscalls added and nothing else - the smallest
    # hole that gets the engine running. A deliberate trade rather than a
    # setting: io_uring reaches further into the kernel than ordinary sockets,
    # and this platform runs code written by strangers in the same process.
    security_opt:
      - seccomp=./seccomp-ioxide.json
    sysctls:
      # lets the unprivileged user bind 80 and 443 inside its own network
      # namespace, so the server keeps running as uid 1001
      - net.ipv4.ip_unprivileged_port_start=0
    volumes:
      - lambda-data:/data
      - /opt/genhttp-lambda/certs:/certs:ro
      - /opt/genhttp-lambda/acme:/acme:ro
    networks:
      default:
      agent-net:
      build-net:
        aliases:
          # The agent talks to the MCP over this network, and the server
          # redirects plain HTTP to HTTPS - so it has to be HTTPS, and HTTPS
          # has to match the certificate. Answering to its own public name on
          # the internal network means the agent uses the real address with a
          # valid certificate and the traffic still never leaves the machine.
          - genhttp.dev
    restart: unless-stopped
    # What docker keeps of stdout, which has the address of every caller on
    # it: a fixed amount, the oldest going first, rather than a file that
    # grows for as long as the container lives. The privacy policy promises
    # exactly this, so a change here is a change to that page as well.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # The build agent's runner. It runs Claude Code against whatever a stranger
  # typed, so it is put where it cannot do much.
  #
  # A prompt does not run in the runner. The runner starts a container for it,
  # waits for it and throws it away, so every build gets a filesystem nobody
  # else has touched, caps of its own, and a timeout that is a kill rather than
  # a hope. What makes that possible is the docker socket, and what makes the
  # socket acceptable is that nothing a model writes ever executes beside it.
  #
  # Three networks keep those halves apart:
  #
  #   agent-net   internal. The lambda server and the runner, nothing else.
  #               This is how a prompt gets in.
  #   build-net   internal. A build, the egress proxy, and the lambda server
  #               answering to its own public name. The runner is NOT on it, so
  #               a build cannot reach the thing holding the socket.
  #   default     the ordinary bridge. Neither the runner nor a build is on it.
  #               The proxy is, and it resolves only the hosts it is told to.
  agent:
    build:
      context: ../../docker/agent
    image: genhttp-agent:latest
    environment:
      AGENT_PORT: 8401
      # what to start for each build, and what to allow it
      AGENT_BUILD_IMAGE: ${LAMBDA_AGENT_IMAGE:-genhttp-agent:latest}
      AGENT_BUILD_NETWORK: genhttp-build-net
      AGENT_BUILD_MEMORY: ${LAMBDA_AGENT_BUILD_MEMORY:-2g}
      AGENT_BUILD_CPUS: ${LAMBDA_AGENT_BUILD_CPUS:-1.5}
      AGENT_BUILD_PIDS: ${LAMBDA_AGENT_BUILD_PIDS:-256}
      AGENT_MCP_URL: ${LAMBDA_AGENT_MCP_URL:-https://genhttp.dev/mcp}
      AGENT_MODEL: ${LAMBDA_AGENT_MODEL:-claude-opus-5-5}
      AGENT_FABLE_MODEL: ${LAMBDA_AGENT_FABLE_MODEL:-claude-fable-5-1}
      AGENT_MAX_TURNS: ${LAMBDA_AGENT_MAX_TURNS:-60}
      AGENT_TIMEOUT_SECONDS: ${LAMBDA_AGENT_TIMEOUT_SECONDS:-600}
      AGENT_PUBLIC_ORIGIN: ${LAMBDA_AGENT_ORIGIN:-https://genhttp.dev}
      AGENT_TOKEN: ${LAMBDA_AGENT_TOKEN:-}
      # What the builds sign in with: a token of the subscription, made with
      # "claude setup-token" and put into .env by set-token.sh beside this
      # file. It does not refresh, so nothing rotates it away from under them.
      #
      # There is deliberately no API key here. Builds run on the subscription
      # and only on the subscription; a key would spend per run against a
      # different account with nothing on screen saying so. The build
      # container clears the variable outright rather than merely not
      # forwarding it - see builder.mjs.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # everything it says to the model goes through the proxy, because it has
      # no other way out
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: genhttp.dev,lambda,localhost,127.0.0.1
    volumes:
      # The one real privilege in here, and the reason for the split above.
      # Anything that can create a container can create one that mounts the
      # host and becomes root on it, so this belongs only to a process that
      # never runs somebody else's code - which, since builds moved out of it,
      # this one does not. If that ever stops being true, this line is the
      # first thing to take away.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-990}"
    networks:
      - agent-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped
    # One line per build, with the start of what was asked for. A deploy
    # recreates this container only when its image changed, so without a cap
    # its log would keep every prompt typed in between. Capped like the
    # server's, and promised the same way on the privacy page.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The only way out for a build: to Anthropic, and nowhere else.
  egress-proxy:
    image: genhttp-agent:latest
    command: ["node", "/app/proxy.mjs"]
    environment:
      PROXY_PORT: 3128
      PROXY_ALLOW: ${LAMBDA_AGENT_EGRESS:-api.anthropic.com,console.anthropic.com,statsig.anthropic.com,claude.ai}
    depends_on:
      - agent
    networks:
      - build-net
      - default
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped

networks:

  # The bridge the server is published on, given IPv6 of its own.
  #
  # Without it, Docker cannot route an inbound IPv6 connection to an IPv4-only
  # container, so it relays one through docker-proxy instead - which opens a
  # fresh connection from the bridge gateway and loses the address it came
  # from. Every IPv6 visitor then arrives as 172.18.0.1, and on a host with an
  # AAAA record that is most of them: measured at 272 of 337 requests.
  #
  # A unique-local range, so there is nothing to route and nothing to collide
  # with. Inbound is what this is for; outbound keeps using IPv4, because a
  # ULA has no default route - which is why the egress proxy goes on reaching
  # the model API exactly as it did.
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:c0de:1a::/64

  agent-net:
    internal: true

  # named rather than left to the project prefix, because the runner names it
  # on a docker run and should not have to guess what compose called it
  build-net:
    name: genhttp-build-net
    internal: true

volumes:
  lambda-data:
